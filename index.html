	<script>
		// 自动传递 islogin=true 到所有子页面链接
function appendLoginParamToAllLink() {
    const urlParams = new URLSearchParams(location.search);
    const isLogin = urlParams.get("islogin") === "true";
    if (!isLogin) return;

    // 获取页面全部a标签
    const allA = document.querySelectorAll("a");
    allA.forEach(a => {
        const originHref = a.getAttribute("href");
        // 排除外部网址（luogu、xiaoziyi等外链不追加参数）
        if (originHref.startsWith("http")) return;
        if (!originHref) return;

        // 拆分原有链接和已有参数
        const hasParam = originHref.includes("?");
        if (hasParam) {
            a.href = originHref + "&islogin=true";
        } else {
            a.href = originHref + "?islogin=true";
        }
    })
}
// 页面加载执行
appendLoginParamToAllLink();
</script>
